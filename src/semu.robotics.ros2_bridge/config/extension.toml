[core]
reloadable = true
order = 0

[package]
version = "1.1.0"
category = "Simulation"
feature = false
app = false
title = "ROS2 Bridge (semu namespace, Isaac Sim 5.1 / Humble port)"
description = "ROS2 interfaces (semu namespace)"
authors = ["Toni-SM"]
repository = "https://github.com/ry0hei-kobayashi/semu.robotics.ros2_bridge"
keywords = ["ROS2", "control"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[package.target]
config = ["release"]
platform = ["linux-x86_64"]
python = ["py311", "cp311"]

[dependencies]
"omni.kit.uiapp" = {}
# deprecated since Isaac Sim 4.5 but still shipped in 5.1 (extsDeprecated/)
"omni.isaac.dynamic_control" = {}
# provides the bundled rclpy (ROS 2 Humble, Python 3.11)
"isaacsim.ros2.bridge" = {}

[[python.module]]
name = "semu.robotics.ros2_bridge"

[[python.module]]
name = "semu.robotics.ros2_bridge.tests"

[settings]
exts."semu.robotics.ros2_bridge".nodeName = "SemuRos2Bridge"
exts."semu.robotics.ros2_bridge".eventTimeout = 5.0
exts."semu.robotics.ros2_bridge".setAttributeUsingAsyncio = false
# Components created when the timeline starts playing (JSON). The upstream version
# discovered them from semu.usd.schemas prims; this port has no schema dependency,
# so they are configured here instead. Example:
#   [{"type": "Attribute"},
#    {"type": "FollowJointTrajectory", "articulation": "/panda",
#     "action": "/panda_arm_controller/follow_joint_trajectory"},
#    {"type": "GripperCommand", "articulation": "/panda",
#     "action": "/panda_hand_controller/gripper_command", "joints": ["panda_finger_joint1", "panda_finger_joint2"]}]
exts."semu.robotics.ros2_bridge".components = "[{\"type\": \"Attribute\"}]"
exts."semu.robotics.ros2_bridge".setAttributeUsingAsyncio = false

[[native.library]]
path = "bin/libadd_on_msgs__rosidl_generator_py.so"
[[native.library]]
path = "bin/libadd_on_msgs__rosidl_generator_c.so"
[[native.library]]
path = "bin/libadd_on_msgs__rosidl_typesupport_c.so"
[[native.library]]
path = "bin/libadd_on_msgs__rosidl_typesupport_fastrtps_c.so"
[[native.library]]
path = "bin/libadd_on_msgs__rosidl_typesupport_introspection_c.so"
[[native.library]]
path = "bin/libcontrol_msgs__rosidl_generator_c.so"
[[native.library]]
path = "bin/libcontrol_msgs__rosidl_generator_py.so"
[[native.library]]
path = "bin/libcontrol_msgs__rosidl_typesupport_c.so"
[[native.library]]
path = "bin/libcontrol_msgs__rosidl_typesupport_fastrtps_c.so"
[[native.library]]
path = "bin/libcontrol_msgs__rosidl_typesupport_introspection_c.so"
